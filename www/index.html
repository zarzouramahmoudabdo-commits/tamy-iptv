<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1024">
<title>TAMY IPTV</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="topbar"></div>
  <main id="view" tabindex="-1"></main>
</div>
<div id="miniradio" class="hidden"></div>

<div id="player" class="hidden" aria-label="player">
  <video id="vid" playsinline poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
  <iframe id="yt" class="hidden" allow="autoplay; fullscreen" allowfullscreen></iframe>
  <div id="pl-spin" class="spin hidden"></div>
  <div id="pl-err" class="pl-err hidden"></div>
  <div id="pl-top" class="pl-bar top"></div>
  <div id="pl-bot" class="pl-bar bot"></div>
</div>

<div id="modal" class="hidden"></div>
<div id="toast" class="hidden"></div>
<audio id="aud" preload="none"></audio>

<script src="vendor/hls.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
