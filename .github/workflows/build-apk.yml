name: Build TAMY IPTV APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Copy hls.js into www
        run: npm run prepare:www

      - name: Add Android platform
        run: npx cap add android

      - name: Patch manifest (cleartext + Android TV)
        run: python3 scripts/patch_android.py

      - name: Generate launcher icons
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0b1024' --iconBackgroundColorDark '#0b1024' --splashBackgroundColor '#0b1024' --splashBackgroundColorDark '#0b1024'

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TAMY-IPTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TAMY-IPTV-apk
          path: TAMY-IPTV.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TAMY IPTV build ${{ github.run_number }}
          files: TAMY-IPTV.apk
