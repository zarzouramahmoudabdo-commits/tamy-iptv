name: Build TAMY IPTV APK

on:
  push:
    branches: [main, master]
    paths: ['capacitor.config.json', 'package.json', 'scripts/**', 'assets/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MODE: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      # الـAPK مجرد "غلاف" يفتح الموقع الحي على GitHub Pages
      - name: Point shell at live site
        run: |
          NH=$(cat capacitor.config.json package.json scripts/patch_android.py scripts/patch_native.py scripts/patch_native_pro.py assets/* | sha256sum | cut -c1-8)
          echo "NH=$NH" >> "$GITHUB_ENV"
          OWNER_LC=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
          REPO="${GITHUB_REPOSITORY#*/}"
          node scripts/set-url.js "https://${OWNER_LC}.github.io/${REPO}/?apk=${{ github.run_number }}&nh=${NH}"

      - name: Copy hls.js into www
        run: npm run prepare:www

      # 1) الأفضل: مشغّل ExoPlayer المتقدم (شاشات متعددة + PiP + قائمة قنوات)
      - name: Build with advanced native player
        id: pro
        continue-on-error: true
        run: |
          npx cap add android
          python3 scripts/patch_android.py
          python3 scripts/patch_native.py
          python3 scripts/patch_native_pro.py
          npx @capacitor/assets generate --android --iconBackgroundColor '#0b1024' --iconBackgroundColorDark '#0b1024' --splashBackgroundColor '#0b1024' --splashBackgroundColorDark '#0b1024'
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Mark pro mode
        if: steps.pro.outcome == 'success'
        run: echo "MODE=pro" >> "$GITHUB_ENV"

      # 2) لو فشل: المشغّل الأصلي البسيط
      - name: Build with basic native player
        id: native
        if: steps.pro.outcome == 'failure'
        continue-on-error: true
        run: |
          rm -rf android
          npx cap add android
          python3 scripts/patch_android.py
          python3 scripts/patch_native.py
          npx @capacitor/assets generate --android --iconBackgroundColor '#0b1024' --iconBackgroundColorDark '#0b1024' --splashBackgroundColor '#0b1024' --splashBackgroundColorDark '#0b1024'
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Mark native mode
        if: steps.pro.outcome == 'failure' && steps.native.outcome == 'success'
        run: echo "MODE=native" >> "$GITHUB_ENV"

      # 3) لو فشل كل شيء: نسخة WebView فقط
      - name: Fallback build (web player only)
        if: steps.pro.outcome == 'failure' && steps.native.outcome == 'failure'
        run: |
          rm -rf android
          npx cap add android
          python3 scripts/patch_android.py
          npx @capacitor/assets generate --android --iconBackgroundColor '#0b1024' --iconBackgroundColorDark '#0b1024' --splashBackgroundColor '#0b1024' --splashBackgroundColorDark '#0b1024'
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TAMY-IPTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TAMY-IPTV-apk
          path: TAMY-IPTV.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TAMY IPTV build ${{ github.run_number }} (${{ env.MODE }} player)
          body: "build ${{ github.run_number }} native ${{ env.NH }} — Player mode: ${{ env.MODE }}"
          files: TAMY-IPTV.apk
